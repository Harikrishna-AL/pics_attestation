<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="Assets/css/Admin_common.css">
    <script src="Assets/js/message.js" defer></script>

    <style>
        :root {
            --bg-1: #021b2b;
            --bg-2: #04384f;
            --accent: #00c6ff;
            --accent-2: #0072ff;
            --card: rgba(255, 255, 255, 0.08);
            --card-hover: rgba(255, 255, 255, 0.14);
            --border: rgba(255, 255, 255, 0.18);
            --text: #ffffff;
            --muted: rgba(255, 255, 255, 0.72);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
            color: var(--text);
            background:
                radial-gradient(900px 500px at 15% 0%, rgba(0, 198, 255, 0.28), transparent 60%),
                radial-gradient(800px 500px at 90% 100%, rgba(0, 114, 255, 0.28), transparent 60%),
                linear-gradient(160deg, var(--bg-1), var(--bg-2));
            background-attachment: fixed;
            overflow-x: hidden;
        }

        /* ---------- Logout ---------- */
        .logout-btn {
            position: absolute;
            top: 20px;
            right: 24px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 77, 79, 0.15);
            border: 1px solid rgba(255, 77, 79, 0.6);
            color: #ffd6d6;
            padding: 9px 18px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            border-radius: 999px;
            backdrop-filter: blur(6px);
            transition: background 0.25s, color 0.25s, transform 0.25s;
            z-index: 9999;
        }

        .logout-btn:hover {
            background: #ff4d4f;
            color: #fff;
            transform: translateY(-1px);
        }

        /* ---------- Hero ---------- */
        .hero {
            text-align: center;
            padding: 70px 20px 10px;
        }

        .center-logo img {
            width: 180px;
            max-width: 60vw;
            border-radius: 6px;
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.5);
        }

        .hero h1 {
            margin: 28px 0 6px;
            font-size: clamp(26px, 4vw, 38px);
            font-weight: 700;
            letter-spacing: 0.3px;
        }

        .hero p {
            margin: 0;
            color: var(--muted);
            font-size: 16px;
        }

        .hero .divider {
            width: 70px;
            height: 4px;
            margin: 20px auto 0;
            border-radius: 4px;
            background: linear-gradient(90deg, var(--accent), var(--accent-2));
        }

        /* ---------- Menu grid ---------- */
        .home-container {
            width: 100%;
            max-width: 1050px;
            padding: 40px 24px 60px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 24px;
        }

        .menu-item {
            width: 190px;
            padding: 28px 18px 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
            text-align: center;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
            cursor: pointer;
            transition: transform 0.3s ease, background 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
            animation: rise 0.6s ease both;
        }

        .menu-item:nth-child(1) {
            animation-delay: 0.05s;
        }

        .menu-item:nth-child(2) {
            animation-delay: 0.12s;
        }

        .menu-item:nth-child(3) {
            animation-delay: 0.19s;
        }

        .menu-item:nth-child(4) {
            animation-delay: 0.26s;
        }

        .menu-item:nth-child(5) {
            animation-delay: 0.33s;
        }

        .menu-item:nth-child(6) {
            animation-delay: 0.4s;
        }

        .menu-item:hover,
        .menu-item:focus-within {
            transform: translateY(-8px);
            background: var(--card-hover);
            border-color: var(--accent);
            box-shadow: 0 18px 40px rgba(0, 198, 255, 0.25);
        }

        .icon-wrap {
            width: 92px;
            height: 92px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fff;
            border-radius: 50%;
            padding: 16px;
            box-shadow: 0 0 0 5px rgba(255, 255, 255, 0.12);
            transition: transform 0.3s ease;
        }

        .menu-item:hover .icon-wrap {
            transform: scale(1.08);
        }

        .menu-item img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .menu-item svg {
            width: 100%;
            height: 100%;
        }

        .menu-item button {
            width: 100%;
            padding: 11px 14px;
            border: none;
            border-radius: 999px;
            background: linear-gradient(90deg, var(--accent), var(--accent-2));
            color: #fff;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: filter 0.25s, box-shadow 0.25s;
        }

        .menu-item button:hover {
            filter: brightness(1.1);
            box-shadow: 0 6px 16px rgba(0, 114, 255, 0.5);
        }

        .menu-item button:focus-visible,
        .logout-btn:focus-visible {
            outline: 3px solid #fff;
            outline-offset: 2px;
        }

        @keyframes rise {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 480px) {
            .menu-item {
                width: 100%;
                max-width: 320px;
            }

            .hero {
                padding-top: 80px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                animation: none !important;
                transition: none !important;
            }
        }
    </style>
    <link rel="stylesheet" href="Assets/css/pics_theme.css">
    <style>
        /* ===== PICS blue theme - page specific (visual only) ===== */
        :root {
            --bg-1: #0a1f44;
            --bg-2: #0b3a8f;
            --accent: #3b82f6;
            --accent-2: #1e40af;
        }

        body {
            font-family: var(--pics-font);
        }

        .center-logo img {
            border-radius: 22px;
            padding: 6px;
            background: #fff;
            box-shadow: 0 16px 40px rgba(0, 0, 0, .35), 0 0 0 6px rgba(255, 255, 255, .08);
        }

        .hero h1 {
            letter-spacing: -.3px;
        }

        .hero .divider {
            background: linear-gradient(90deg, var(--pics-cyan), var(--pics-blue-500));
        }

        .menu-item button {
            font-family: var(--pics-font);
            font-weight: 600;
            letter-spacing: .3px;
            background: linear-gradient(135deg, var(--pics-blue-500), var(--pics-blue-800));
            box-shadow: 0 8px 18px rgba(0, 0, 0, .25);
        }

        .menu-item:hover,
        .menu-item:focus-within {
            border-color: var(--pics-blue-400);
            box-shadow: 0 18px 40px rgba(59, 130, 246, .30);
        }

        .icon-wrap {
            box-shadow: 0 0 0 5px rgba(255, 255, 255, .12), 0 10px 24px rgba(0, 0, 0, .25);
        }

        .logout-btn {
            background: rgba(255, 255, 255, .12);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, .35);
            backdrop-filter: blur(6px);
            box-shadow: none;
        }

        .logout-btn:hover {
            background: #ef4444;
            border-color: #ef4444;
            color: #fff;
        }
    </style>
</head>

<body>

    <button class="logout-btn" id="logoutBtn">Logout</button>

    <!-- Header / Logo -->
    <header class="hero">
        <div class="center-logo">
            <img src="images/pics_logo.jpg" alt="Logo">
        </div>
        <h1>Admin Dashboard</h1>
        <p>Choose an option to get started</p>
        <div class="divider"></div>
    </header>

    <!-- Menu Items -->
    <main class="home-container">

        <div class="menu-item" onclick="location.href='Markattendance.html'">
            <div class="icon-wrap"><img src="images/Attendancelogo.png" alt="Mark Attendance"></div>
            <button onclick="event.stopPropagation(); location.href='Markattendance.html'">Mark Attendance</button>
        </div>

        <div class="menu-item" onclick="location.href='Insert_Admin.html'">
            <div class="icon-wrap"><img src="images/insert.png" alt="Insert Data"></div>
            <button onclick="event.stopPropagation(); location.href='Insert_Admin.html'">Insert Data</button>
        </div>

        <div class="menu-item" onclick="location.href='ViewData_Admin.html'">
            <div class="icon-wrap"><img src="images/view-data.png" alt="View Data"></div>
            <button onclick="event.stopPropagation(); location.href='ViewData_Admin.html'">View Data</button>
        </div>

        <div class="menu-item" onclick="location.href='ModifyData_Admin.html'">
            <div class="icon-wrap"><img src="images/modify.webp" alt="Modify"></div>
            <button onclick="event.stopPropagation(); location.href='ModifyData_Admin.html'">Modify Data</button>
        </div>

        <div class="menu-item" onclick="location.href='EnquiryDashboard.html'">
            <div class="icon-wrap"><img src="images/quick-enquiry.jpeg" alt="Enquiry"></div>
            <button onclick="event.stopPropagation(); location.href='EnquiryDashboard.html'">Enquiry Dashboard</button>
        </div>

        <div class="menu-item" onclick="location.href='UploadDashboard.html'">
            <div class="icon-wrap">
                <!-- cloud-upload icon (drawn in the page, no image file needed) -->
                <svg viewBox="0 0 64 64" role="img" aria-label="Data Upload Dashboard" fill="none" stroke="#1e40af" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20 44h-1a11 11 0 0 1-1.6-21.9A15 15 0 0 1 46.4 25 10 10 0 0 1 45 44h-1"/>
                    <path d="M32 52V30"/>
                    <path d="M23 38l9-9 9 9"/>
                </svg>
            </div>
            <button onclick="event.stopPropagation(); location.href='UploadDashboard.html'">Data Upload Dashboard</button>
        </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Your global config -->
    <script src="Assets/js/supabaseConfig.js"></script>
    <script src="Assets/js/Logout.js"></script>
    <script>
        // Protect dashboard page
        window.supabaseClient.auth
            .getSession()
            .then(({ data }) => {
                if (!data.session) {
                    window.location.href = "Login_Admin.html";
                    return;
                }
            });

        document.getElementById("logoutBtn")?.addEventListener("click", logoutUser);
    </script>

</body>

</html>
