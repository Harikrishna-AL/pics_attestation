<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="Assets/css/Admin_common.css">
<script src="Assets/js/message.js" defer></script>
  <title>Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --navy:#0a1f44;
      --blue-900:#0b3a8f;
      --blue-700:#0057d9;
      --blue-500:#1e7bff;
      --blue-300:#5fb4ff;
      --cyan:#00c6ff;
      --ink:#14213d;
      --muted:#6b7a99;
      --line:#d9e3f5;
      --field:#f4f8ff;
    }
    *{box-sizing:border-box;}

    body{
      font-family:'Poppins', Arial, sans-serif;
      margin:0;
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:24px 16px;
      background:
        radial-gradient(circle at 15% 20%, rgba(0,198,255,.35), transparent 45%),
        radial-gradient(circle at 85% 80%, rgba(30,123,255,.45), transparent 45%),
        linear-gradient(135deg, var(--navy) 0%, var(--blue-900) 50%, var(--blue-700) 100%);
      overflow-x:hidden;
      position:relative;
    }

    /* floating background shapes */
    .bg-shape{
      position:fixed;
      border-radius:50%;
      filter:blur(2px);
      opacity:.55;
      z-index:0;
      animation:float 14s ease-in-out infinite;
    }
    .bg-shape.s1{width:320px;height:320px;top:-90px;left:-80px;
      background:linear-gradient(135deg, rgba(0,198,255,.55), rgba(30,123,255,.15));}
    .bg-shape.s2{width:420px;height:420px;bottom:-140px;right:-120px;
      background:linear-gradient(135deg, rgba(95,180,255,.45), rgba(0,87,217,.1));
      animation-delay:-5s;}
    .bg-shape.s3{width:140px;height:140px;top:18%;right:12%;
      background:linear-gradient(135deg, rgba(255,255,255,.35), rgba(255,255,255,.05));
      animation-delay:-9s;}
    @keyframes float{
      0%,100%{transform:translate(0,0) scale(1);}
      50%{transform:translate(20px,-25px) scale(1.05);}
    }

    .login-card{
      position:relative;
      z-index:1;
      width:100%;
      max-width:400px;
      padding:38px 34px 30px;
      border-radius:24px;
      background:rgba(255,255,255,.96);
      border:1px solid rgba(255,255,255,.6);
      box-shadow:
        0 30px 60px rgba(4,20,60,.45),
        0 0 0 6px rgba(255,255,255,.08);
      text-align:center;
      animation:rise .6s cubic-bezier(.2,.9,.2,1) both;
    }
    .login-card::before{
      content:"";
      position:absolute;
      top:0;left:24px;right:24px;
      height:4px;
      border-radius:0 0 6px 6px;
      background:linear-gradient(90deg, var(--cyan), var(--blue-500), var(--blue-900));
    }
    @keyframes rise{
      from{opacity:0;transform:translateY(24px) scale(.98);}
      to{opacity:1;transform:none;}
    }

    .logo-wrap{
      width:88px;height:88px;
      margin:0 auto 16px;
      border-radius:22px;
      padding:6px;
      background:linear-gradient(135deg, var(--cyan), var(--blue-700));
      box-shadow:0 12px 24px rgba(0,87,217,.35);
    }
    .logo{
      width:100%;height:100%;
      object-fit:cover;
      border-radius:17px;
      background:#fff;
      display:block;
    }

    h2{
      margin:0;
      color:var(--ink);
      font-size:26px;
      font-weight:700;
      letter-spacing:-.3px;
    }
    .subtitle{
      margin:6px 0 26px;
      color:var(--muted);
      font-size:14px;
    }

    .field{
      position:relative;
      margin-bottom:14px;
      text-align:left;
    }
    .field svg.icon{
      position:absolute;
      left:15px;top:50%;
      transform:translateY(-50%);
      width:18px;height:18px;
      stroke:var(--muted);
      fill:none;
      stroke-width:2;
      pointer-events:none;
      transition:stroke .2s;
    }
    .field input{
      width:100%;
      padding:14px 46px 14px 44px;
      border:1.5px solid var(--line);
      border-radius:14px;
      background:var(--field);
      font:inherit;
      font-size:15px;
      color:var(--ink);
      outline:none;
      transition:border-color .2s, box-shadow .2s, background .2s;
    }
    .field input::placeholder{color:#9aa8c3;}
    .field input:focus{
      border-color:var(--blue-500);
      background:#fff;
      box-shadow:0 0 0 4px rgba(30,123,255,.15);
    }
    .field input:focus + svg.icon,
    .field:focus-within svg.icon{stroke:var(--blue-500);}

    .toggle-pass{
      position:absolute;
      right:8px;top:50%;
      transform:translateY(-50%);
      width:34px;height:34px;
      border:none;background:transparent;
      border-radius:10px;
      cursor:pointer;
      display:flex;align-items:center;justify-content:center;
      color:var(--muted);
    }
    .toggle-pass:hover{background:rgba(30,123,255,.08);color:var(--blue-500);}
    .toggle-pass svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;}

    .btn{
      width:100%;
      padding:14px;
      border-radius:14px;
      font:inherit;
      font-size:15px;
      font-weight:600;
      cursor:pointer;
      display:flex;align-items:center;justify-content:center;gap:10px;
      transition:transform .15s, box-shadow .2s, background .2s, border-color .2s;
    }
    .btn:active{transform:translateY(1px);}
    .btn:disabled{opacity:.7;cursor:progress;}

    .btn-primary{
      margin-top:6px;
      border:none;
      color:#fff;
      background:linear-gradient(135deg, var(--blue-500) 0%, var(--blue-700) 60%, var(--blue-900) 100%);
      box-shadow:0 12px 24px rgba(0,87,217,.35);
    }
    .btn-primary:hover{box-shadow:0 16px 30px rgba(0,87,217,.45);transform:translateY(-1px);}

    .btn-outline{
      border:1.5px solid rgba(30,123,255,.35);
      background:rgba(30,123,255,.06);
      color:var(--blue-700);
    }
    .btn-outline:hover{background:rgba(30,123,255,.12);border-color:var(--blue-500);}
    .btn-outline svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;}

    .btn-google{
      margin-top:10px;
      border:1.5px solid var(--line);
      background:#fff;
      color:#3c4043;
    }
    .btn-google:hover{background:#f6f9ff;border-color:#b9cbef;}
    .btn-google img{width:20px;height:20px;}

    .divider{
      display:flex;align-items:center;gap:12px;
      margin:22px 0 18px;
      color:#9aa8c3;
      font-size:12px;
      font-weight:500;
      letter-spacing:1px;
      text-transform:uppercase;
    }
    .divider::before,.divider::after{
      content:"";flex:1;height:1px;background:var(--line);
    }

    .hint{
      font-size:12.5px;
      color:var(--muted);
      margin:10px 0 0;
    }

    .error{
      color:#d6332a;
      font-size:13.5px;
      margin:14px 0 0;
      min-height:1em;
    }
    .error:not(:empty){
      padding:10px 12px;
      border-radius:10px;
      background:#fff2f2;
      border:1px solid #ffd6d6;
    }

    .footer-note{
      margin-top:22px;
      font-size:12px;
      color:#9aa8c3;
      display:flex;align-items:center;justify-content:center;gap:6px;
    }
    .footer-note svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;}

    @media (max-width:420px){
      .login-card{padding:32px 22px 24px;border-radius:20px;}
      h2{font-size:23px;}
    }
    @media (prefers-reduced-motion:reduce){
      .bg-shape,.login-card{animation:none;}
    }
  </style>
</head>
<body>

  <div class="bg-shape s1"></div>
  <div class="bg-shape s2"></div>
  <div class="bg-shape s3"></div>

  <div class="login-card">
    <div class="logo-wrap">
      <img src="images/pics_logo.jpg" alt="Company Logo" class="logo">
    </div>

    <h2>Welcome Back</h2>
    <p class="subtitle">Sign in to continue to your dashboard</p>

    <form id="login-form">
      <div class="field">
        <input type="email" id="email" placeholder="Email Address" autocomplete="email" required>
        <svg class="icon" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
      </div>

      <div class="field">
        <input type="password" id="password" placeholder="Password" autocomplete="current-password" required>
        <svg class="icon" viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
        <button type="button" class="toggle-pass" id="toggle-pass" aria-label="Show password">
          <svg viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>

      <button type="submit" class="btn btn-primary" id="login-btn">Login</button>

      <div class="divider">or</div>

      <button type="button" id="magic-link-btn" class="btn btn-outline">
        <svg viewBox="0 0 24 24"><path d="M15 4V2M15 16v-2M8 9h2M20 9h2M17.8 11.8 19 13M17.8 6.2 19 5M3 21l9-9M12.2 6.2 11 5"/></svg>
        Login with Magic Link
      </button>
      <p class="hint">We’ll send a secure login link to your email.</p>

      <button type="button" id="google-login-btn" class="btn btn-google">
        <img src="https://developers.google.com/identity/images/g-logo.png" alt="">
        <span>Sign in with Google</span>
      </button>

      <p id="error-message" class="error"></p>
    </form>

    <div class="footer-note">
      <svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      Secured access for PICS staff &amp; admins
    </div>
  </div>

  <!-- Supabase client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="Assets/js/supabaseConfig.js"></script>

  <script>

    const form = document.getElementById("login-form");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const errorMessage = document.getElementById("error-message");

    const togglePass = document.getElementById("toggle-pass");
    togglePass.addEventListener("click", () => {
      const show = passwordInput.type === "password";
      passwordInput.type = show ? "text" : "password";
      togglePass.setAttribute("aria-label", show ? "Hide password" : "Show password");
      togglePass.style.color = show ? "var(--blue-500)" : "";
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorMessage.textContent = "";

      const email = emailInput.value.trim();
      const password = passwordInput.value;

    const supabase = window.supabaseClient;

const { data, error } = await supabase.auth.signInWithPassword({

        email,
        password
      });

      if (error) {
        errorMessage.textContent = error.message;
      } 
       else {
    const user = data.user;

    // Get user role from metadata
    const role = user.user_metadata?.role;

    if (role === "staff") {
        window.location.href = "Home.html";
    } 
    else if (role === "admin") {
        window.location.href = "Dashboard_Admin.html";
    }
    else {
        // Default fallback (optional)
        alert("No role found for this user.");
    }
      
  }
    });

          //window.location.href = "Maintenance.html";

          const magicBtn = document.getElementById("magic-link-btn");

magicBtn.addEventListener("click", async () => {
  errorMessage.textContent = "";

  const email = emailInput.value.trim();

  if (!email) {
    errorMessage.textContent = "Please enter your email first.";
    return;
  }

  const supabase = window.supabaseClient;

 const { error } = await supabase.auth.signInWithOtp({
  email: email,
  options: {
    emailRedirectTo: "https://picsattestation.in/PICS_Admin/auth-callback.html",
    shouldCreateUser: false

  }
});

  if (error) {
    errorMessage.textContent = error.message;
  } else {
    showSuccess("Magic link sent! Please check your email.", {
            buttonText: "Continue",
            onClose: () => window.location.href = "Login_Admin.html"
        });
  }
});


const googleBtn = document.getElementById("google-login-btn");

googleBtn.addEventListener("click", async () => {

  const supabase = window.supabaseClient;

  const { data, error } = await supabase.auth.signInWithOAuth({
    provider: "google",
    options: {
      redirectTo: "https://picsattestation.in/PICS_Admin/auth-callback.html"
    }
  });

  if (error) {
    errorMessage.textContent = error.message;
  }

});

 
  </script>
</body>
</html>
